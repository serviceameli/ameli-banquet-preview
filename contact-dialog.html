<dialog class="contact-dialog" id="contactDialog" aria-labelledby="contactDialogTitle" aria-describedby="contactDialogIntro">
  <div class="contact-dialog-inner">
    <button class="contact-close" type="button" aria-label="Закрыть окно связи"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    <p class="contact-eyebrow">AMELI · ДЛЯ ПЛОЩАДОК</p>
    <h2 id="contactDialogTitle" tabindex="-1" autofocus>Обсудим вашу площадку</h2>
    <p id="contactDialogIntro" class="contact-intro">Выберите удобный способ связи. Можно сразу прислать фотографии зала и коротко описать задачу.</p>
    <div class="contact-quote" id="contactQuote" hidden>
      <p>Ваш расчёт добавлен в черновик для Telegram, WhatsApp и почты.</p>
      <button class="contact-copy" type="button">Скопировать расчёт</button>
      <p class="contact-copy-status" role="status"></p>
      <textarea class="contact-copy-fallback" aria-label="Ваш расчёт — скопируйте текст" readonly hidden></textarea>
    </div>
    {{contact_options}}
  </div>
</dialog>
